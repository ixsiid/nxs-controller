name: Zephyr build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        conf: [release, debug]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: .

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-venv python3-setuptools \
            xz-utils file make gcc g++ libsdl2-dev libmagic1 libusb-1.0-0-dev

      - name: Install west
        run: pip install -U west

      - name: Cache Zephyr SDK archive
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-1.0.1
          key: zephyr-sdk-1.0.1-linux-x86_64-gnu

      - name: Download Zephyr SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          cd ~
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/zephyr-sdk-1.0.1_linux-x86_64_gnu.tar.xz
          tar xf zephyr-sdk-1.0.1_linux-x86_64_gnu.tar.xz

      - name: Register Zephyr SDK with CMake
        run: |
          cd ~/zephyr-sdk-1.0.1
          ./setup.sh -t arm-zephyr-eabi -h -c

      - name: Init west workspace
        run: |
          west init -l .
          west update
          west zephyr-export
          pip install -r zephyr/scripts/requirements.txt

      - name: Build firmware (${{ matrix.conf }})
        run: |
          if [ "${{ matrix.conf }}" = "debug" ]; then
            west build -p always -b xiao_ble -s . -- -DEXTRA_CONF_FILE=debug.conf
          else
            west build -p always -b xiao_ble -s .
          fi

      - name: Rename artifact
        run: cp build/zephyr/zephyr.uf2 nxs-controller-${{ matrix.conf }}.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: nxs-controller-${{ matrix.conf }}-firmware
          path: nxs-controller-${{ matrix.conf }}.uf2